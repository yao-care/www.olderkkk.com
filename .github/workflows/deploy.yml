name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

# 讓所有 JS actions 改用 Node 24 runtime，消除 Node 20 棄用警告
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # sitemap 的 lastmod 由 astro.config.mjs 讀每頁原始檔的最後一次 commit 日期算出。
          # 淺 clone（預設 depth 1）只看得到一個 commit，會讓全站日期一起變成最後那次 push。
          fetch-depth: 0
      # 正式網域切換總開關：設 repo 變數 CUSTOM_DOMAIN=www.olderkkk.com 即切換；
      # 未設時維持 GitHub Pages 子路徑（不影響現站）。
      - name: Write CNAME for custom domain
        if: ${{ vars.CUSTOM_DOMAIN != '' }}
        run: echo "${{ vars.CUSTOM_DOMAIN }}" > public/CNAME
      - name: Build with Astro
        uses: withastro/action@v3
        with:
          node-version: 22
        env:
          BASE_PATH: ${{ vars.CUSTOM_DOMAIN != '' && '/' || '/www.olderkkk.com' }}
          SITE_URL: ${{ vars.CUSTOM_DOMAIN != '' && format('https://{0}', vars.CUSTOM_DOMAIN) || 'https://yao-care.github.io' }}
          # GA4：設 repo 變數 GA_ID=G-XXXXXXXX 即開啟追蹤（未設則不輸出追蹤碼）
          PUBLIC_GA_ID: ${{ vars.GA_ID }}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
  # 上線後把 sitemap URL 送 IndexNow（Bing/Yandex/Seznam/Naver 即時收錄；Google 不吃 IndexNow）。
  # 金鑰非機密（本就公開託管於 /<key>.txt），直接寫在 env。任何失敗 exit 0，不擋部署。
  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Submit sitemap URLs to IndexNow
        env:
          SITE_URL: https://www.olderkkk.com
          INDEXNOW_KEY: 908a673f8a061dd061b629db168857b6
        run: node scripts/indexnow-submit.mjs
  # 任一階段 fail → 發 Slack 要求修改；修正 push 後 workflow 自動重跑＝重審。
  # 需 repo secrets：SLACK_BOT_TOKEN、SLACK_CHANNEL_ID（缺則靜默略過）。
  notify-failure:
    needs: [build, deploy]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Notify Slack
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
        run: |
          if [ -z "$SLACK_BOT_TOKEN" ] || [ -z "$SLACK_CHANNEL_ID" ]; then
            echo "Slack secrets not set; skip notify."
            exit 0
          fi
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          TEXT="🚨 ${{ github.repository }} 部署被守門擋下（commit ${GITHUB_SHA::7}）。請修正設計規範/建置錯誤後 push，workflow 會自動重審。詳情： $RUN_URL"
          curl -sf -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
            -H 'Content-type: application/json; charset=utf-8' \
            -d "$(jq -n --arg ch "$SLACK_CHANNEL_ID" --arg t "$TEXT" '{channel:$ch,text:$t}')"
